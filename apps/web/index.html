<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202426" />
    <title>Vibewise</title>
    <link rel="icon" type="image/svg+xml" href="/src/design/vibewise/wordmarks/compact.svg" />
  </head>
  <body>
    <div id="map" aria-label="Map of Boston"></div>

    <div class="map-controls" role="group" aria-label="Map controls">
      <button type="button" class="control tilt" id="tilt-toggle" title="Switch to 2D view">2D</button>
      <button type="button" class="control" id="compass" title="Reset to north" aria-label="Reset to north">
        <span id="compass-needle" class="compass-needle" data-vw-icon="compass" data-size="24"></span>
      </button>
      <div class="control-stack">
        <button type="button" class="control" id="zoom-in" aria-label="Zoom in" title="Zoom in">
          <span data-vw-icon="plus" data-size="22"></span>
        </button>
        <button type="button" class="control" id="zoom-out" aria-label="Zoom out" title="Zoom out">
          <span data-vw-icon="minus" data-size="22"></span>
        </button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span data-vw-icon="info" data-size="18"></span>
      <span class="toast-text" id="toast-text"></span>
      <button type="button" class="toast-close" id="toast-close" aria-label="Dismiss message">
        <span data-vw-icon="close" data-size="18"></span>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
