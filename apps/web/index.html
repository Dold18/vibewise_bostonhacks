<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibenta Maps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Vibenta type system (all SIL Open Font License): Londrina Solid (display
         lettering), Bricolage Grotesque (interface), Space Mono (utility labels).
         Noto Sans stays for pin labels so they match the map's own labels. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Londrina+Solid:wght@400;900&family=Space+Mono:wght@400;700&family=Noto+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#171b1e" />
  </head>
  <body>
    <div id="map" aria-label="Map of Boston"></div>

    <div class="map-controls">
      <button type="button" class="control tilt" id="tilt-toggle" title="Switch to 2D view">2D</button>
      <button type="button" class="control" id="compass" title="Reset to north" aria-label="Reset to north">
        <svg viewBox="0 0 24 24" width="24" height="24" id="compass-needle" class="vx-icon vx-icon--compass" aria-hidden="true" focusable="false">
          <path class="vx-i-pop" d="M12 2.6l3.6 9.4H8.4z" /><path class="vx-i-ink" d="M12 2.6l3.6 9.4H8.4z" /><path class="vx-i-ink" d="M8.4 12h7.2L12 21.4z" /><circle class="vx-i-dot" cx="12" cy="12" r="1.2" />
        </svg>
      </button>
      <div class="control-stack">
        <button type="button" class="control" id="zoom-in" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" width="22" height="22" class="vx-icon vx-icon--zoomIn" aria-hidden="true" focusable="false"><path class="vx-i-pop" d="M13 8.6a4.4 4.4 0 1 1 0 8.8 4.4 4.4 0 0 1 0-8.8z" /><path class="vx-i-ink" d="M12.1 5.1c.2 4.6.1 9.2-.2 13.8M5.2 12.1c4.6-.3 9.1-.3 13.7-.1" /></svg>
        </button>
        <button type="button" class="control" id="zoom-out" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" width="22" height="22" class="vx-icon vx-icon--zoomOut" aria-hidden="true" focusable="false"><path class="vx-i-pop" d="M13.4 9.6a3.6 3.6 0 1 1 0 7.2 3.6 3.6 0 0 1 0-7.2z" /><path class="vx-i-ink" d="M5.2 12.1c4.6-.3 9.1-.3 13.7-.1" /></svg>
        </button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
